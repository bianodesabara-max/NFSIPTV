name: Teste no emulador

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Gerar APK
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk NFS-IPTV.apk
      - name: Servidor da lista de teste
        run: nohup python3 -m http.server 8000 > /dev/null 2>&1 &
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/teste/roteiro.sh
      - name: Publicar capturas
        if: always()
        run: |
          mkdir -p capturas && cd capturas
          git init -q -b capturas && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm capturas
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas
